<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Библиотека случайных книг</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="data.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="left-header">
          <h1>Моя цифровая библиотека</h1>
          <p>Управляйте вашей коллекцией книг</p>
        </div>
        <div class="right-header">
          <p>Найдите книгу по названию, автору, году выпуска</p>
          <input type="text" title="Введите название, автора или год выпуска" id="searchInput" placeholder="Поиск..." />
        </div>
      </header>
      <main>
        <section id="list-section">
          <div id="book-list"></div>
        </section>
        <section id="form-section">
          <div id="book-form"></div>
        </section>
        <section id="controls-section">
          <div id="controls"></div>
        </section>
        <section id="stats-section">
          <div id="statistics"></div>
        </section>
        <section id="notifications-section">
          <div id="message-container"></div>
        </section>
      </main>
      <footer>
        <p>
          © 2026 Цифровая библиотека | Всего книг:
          <span id="total-counter">0</span>
        </p>
      </footer>
    </div>
  </body>
</html>
